name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Recreate Android Project Files
        run: |
          flutter create . --org hk.edu.tkp --project-name tkp_english

      # 修復 1：提升最低 Android 版本為 21
      - name: Fix Android minSdkVersion
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

      # 修復 2：注入麥克風與錄音權限（解決發音按鍵沒反應）
      - name: Inject Android Permissions
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a \        <queries>\n            <intent>\n                <action android:name="android.speech.RecognitionService" />\n            </intent>\n            <intent>\n                <action android:name="android.intent.action.TTS_SERVICE" />\n            </intent>\n        </queries>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tkp-english-app
          path: build/app/outputs/flutter-apk/app-release.apk
